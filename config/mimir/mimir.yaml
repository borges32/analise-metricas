# Mimir em modo monolítico (single binary) para desenvolvimento local.
multitenancy_enabled: false

server:
  http_listen_port: 9009
  grpc_listen_port: 9095
  log_level: warn

common:
  storage:
    backend: filesystem
    filesystem:
      dir: /data/storage

blocks_storage:
  storage_prefix: blocks
  tsdb:
    dir: /data/tsdb
  bucket_store:
    sync_dir: /data/tsdb-sync

compactor:
  data_dir: /data/compactor
  sharding_ring:
    kvstore:
      store: memberlist

distributor:
  ring:
    kvstore:
      store: memberlist

ingester:
  ring:
    replication_factor: 1
    kvstore:
      store: memberlist

ruler_storage:
  backend: filesystem
  filesystem:
    dir: /data/ruler

store_gateway:
  sharding_ring:
    replication_factor: 1

# Limites generosos para dev + habilita exemplars (correlação métrica -> trace)
# e ingestão out-of-order (útil com geradores/Tempo metrics-generator).
limits:
  ingestion_rate: 100000
  ingestion_burst_size: 200000
  max_global_exemplars_per_user: 100000
  out_of_order_time_window: 1h
  native_histograms_ingestion_enabled: true

usage_stats:
  enabled: false
