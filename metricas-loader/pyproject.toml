[project]
name = "metricas-loader"
version = "0.1.0"
description = "Worker de carga contínua Mimir -> PostgreSQL (métricas OpenTelemetry)"
requires-python = ">=3.12"
dependencies = [
    "psycopg[binary]>=3.1",
    "httpx>=0.27",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[project.scripts]
metricas-loader = "loader.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/loader"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]
# UP017 sugere datetime.UTC (3.11+); mantemos timezone.utc por portabilidade.
ignore = ["UP017"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
