# -----------------------------------------------------------------------------
# EXEMPLO de Secret com as variáveis sensíveis do worker.
# NÃO faça commit de um Secret com valores reais. Copie para secret.yaml
# (que está no .gitignore) e preencha, ou crie via CLI:
#
#   oc -n metricas create secret generic metricas-loader-secret \
#     --from-literal=POSTGRES_DSN='postgresql://metricas:SENHA@HOST:5432/metricas' \
#     --from-literal=MIMIR_BEARER_TOKEN=''
#
# Em ARO, o ideal é usar o Azure Key Vault Provider for Secrets Store CSI Driver
# ou o External Secrets Operator em vez de um Secret em texto.
# -----------------------------------------------------------------------------
apiVersion: v1
kind: Secret
metadata:
  name: metricas-loader-secret
  namespace: metricas
  labels:
    app.kubernetes.io/name: metricas-loader
    app.kubernetes.io/part-of: analise-metricas
type: Opaque
stringData:
  # DSN do Postgres de destino (schema `metricas`). Em ARO, aponte para o
  # Azure Database for PostgreSQL Flexible Server ou para o Postgres interno.
  POSTGRES_DSN: "postgresql://metricas:metricas@metricas-postgres.metricas.svc.cluster.local:5432/metricas"
  # Autenticação opcional do Mimir — deixe vazio se o Mimir não exigir.
  MIMIR_BEARER_TOKEN: ""
  MIMIR_BASIC_AUTH_USER: ""
  MIMIR_BASIC_AUTH_PASS: ""
