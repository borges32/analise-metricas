# -----------------------------------------------------------------------------
# metricas-loader — worker de carga contínua Mimir -> Postgres.
#
# IMPORTANTE: replicas fixo em 1. O worker mantém um watermark no banco e emenda
# rodadas (catch-up); duas réplicas processariam a mesma janela em duplicidade.
# Por isso a estratégia é Recreate (nunca dois pods simultâneos no deploy).
# -----------------------------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: metricas-loader
  namespace: metricas
  labels:
    app.kubernetes.io/name: metricas-loader
    app.kubernetes.io/component: worker
    app.kubernetes.io/part-of: analise-metricas
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: metricas-loader
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: metricas-loader
        app.kubernetes.io/component: worker
        app.kubernetes.io/part-of: analise-metricas
    spec:
      # No OpenShift (SCC restricted-v2) o UID é atribuído pelo namespace; por isso
      # NÃO fixamos runAsUser — deixamos o cluster escolher. A imagem já roda non-root.
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: metricas-loader
          # Substitua pela sua imagem. Em ARO, tipicamente o registry interno do
          # OpenShift ou um Azure Container Registry (ACR).
          #   image-registry.openshift-image-registry.svc:5000/metricas/metricas-loader:latest
          #   <seu-acr>.azurecr.io/metricas-loader:0.1.0
          image: image-registry.openshift-image-registry.svc:5000/metricas/metricas-loader:latest
          imagePullPolicy: Always
          envFrom:
            - configMapRef:
                name: metricas-loader-config
            - secretRef:
                name: metricas-loader-secret
          volumeMounts:
            - name: metricas-config
              mountPath: /app/config
              readOnly: true
          # O worker não expõe HTTP. A liveness reproduz o HEALTHCHECK do Dockerfile:
          # falha se não houve rodada bem-sucedida em ~2x INTERVALO_SEGUNDOS.
          livenessProbe:
            exec:
              command:
                - python
                - -c
                - |
                  import os,time,sys
                  p=os.getenv('HEALTHCHECK_PATH','/tmp/healthy')
                  inter=int(os.getenv('INTERVALO_SEGUNDOS','600'))
                  sys.exit(0 if os.path.exists(p) and (time.time()-os.path.getmtime(p))<2*inter else 1)
            initialDelaySeconds: 60
            periodSeconds: 60
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
      volumes:
        - name: metricas-config
          configMap:
            name: metricas-loader-metricas
